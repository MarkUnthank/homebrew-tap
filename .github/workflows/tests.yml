name: Homebrew
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ASK: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load this formula revision
        run: |
          brew tap MarkUnthank/tap
          cp Formula/icloud-agent.rb "$(brew --repository MarkUnthank/tap)/Formula/icloud-agent.rb"
      - run: brew style MarkUnthank/tap/icloud-agent
      - run: brew install --build-from-source MarkUnthank/tap/icloud-agent
      - run: brew test MarkUnthank/tap/icloud-agent
      - name: Check packaged agent setup
        run: |
          HOME="$RUNNER_TEMP/icloud-agent-home" "$(brew --prefix)/bin/icloud-agent" setup
          test -f "$RUNNER_TEMP/icloud-agent-home/Library/Application Support/icloud-agent/plugin/icloud-agent/skills/icloud-agent/SKILL.md"
