name: Formula checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: homebrew-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formula syntax
        run: ruby -c Formula/icloud-agent.rb
      - name: Verify release archive checksum
        shell: bash
        run: |
          ruby -e 's = File.read("Formula/icloud-agent.rb"); puts s[/^  url "([^"]+)"/, 1]; puts s[/^  sha256 "([^"]+)"/, 1]' > /tmp/release-source
          mapfile -t source < /tmp/release-source
          curl --fail --location --retry 3 "${source[0]}" --output /tmp/icloud-agent.tar.gz
          echo "${source[1]}  /tmp/icloud-agent.tar.gz" | sha256sum --check
